name: BeeMind Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEEMIND_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare persistent signing or explicitly mark temporary build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BEEMIND_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BEEMIND_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BEEMIND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BEEMIND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          count=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -n "${!name}" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" == 4 ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/beemind-test.jks"
            {
              echo "BEEMIND_KEYSTORE_PATH=$RUNNER_TEMP/beemind-test.jks"
              echo "BEEMIND_STORE_PASSWORD=$STORE_PASSWORD"
              echo "BEEMIND_KEY_ALIAS=$KEY_ALIAS"
              echo "BEEMIND_KEY_PASSWORD=$KEY_PASSWORD"
              echo 'SIGNING_LABEL=persistent-test'
            } >> "$GITHUB_ENV"
          elif [[ "$count" == 0 ]]; then
            echo 'SIGNING_LABEL=TEMPORARY-NON-UPGRADE-GUARANTEED' >> "$GITHUB_ENV"
            echo '::warning::No signing secrets. This APK is temporary; future in-place updates are NOT guaranteed.'
          else
            echo '::error::All four BeeMind signing secrets must be set together.'
            exit 1
          fi
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="BeeMind-0.4.0-build-${BEEMIND_VERSION_CODE}-${SIGNING_LABEL}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$name.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$name.apk" > "dist/$name-certificate.txt"
          (cd dist && sha256sum "$name.apk" > "$name.apk.sha256")
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"
          {
            echo "### BeeMind 0.4.0 / build $BEEMIND_VERSION_CODE"
            echo "Signing: $SIGNING_LABEL"
            echo "Application ID: com.beemind.personal"
            echo 'APK signature verified; unit tests and lint passed.'
            if [[ "$SIGNING_LABEL" == TEMPORARY* ]]; then
              echo '**Temporary APK: future updates over this install are NOT guaranteed.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BeeMind-validation-build-${{ env.BEEMIND_VERSION_CODE }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            app/build/reports/screenshots/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/beemind-test.jks"
  reminder-device:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    env:
      BEEMIND_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and isolated device fixture
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native cold-process alarms and ten-minute snooze
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 tools/reminder_device_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BeeMind-reminder-device-api-${{ matrix.api }}-build-${{ github.run_number }}
          path: app/build/reports/reminder-device/
          if-no-files-found: warn
